; Supervisor: keeps the queue worker alive (unit/global fan-out, future export jobs).
[program:ui-memo-worker]
command=php /var/www/ui-memo/api/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=3600
stdout_logfile=/var/log/ui-memo-worker.log
