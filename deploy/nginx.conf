# One domain serves the React build and proxies /api to PHP-FPM.
server {
    listen 443 ssl http2;
    server_name memo.example.edu.ng;
    ssl_certificate     /etc/letsencrypt/live/memo.example.edu.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memo.example.edu.ng/privkey.pem;

    client_max_body_size 25m;                       # memo uploads are up to 20 MB
    root /var/www/ui-memo/web/dist;
    index index.html;

    location / { try_files $uri /index.html; }      # SPA routing

    location /api/ {
        root /var/www/ui-memo/api/public;
        try_files $uri /index.php?$query_string;
    }
    location = /index.php {
        root /var/www/ui-memo/api/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock; # match your PHP version
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 60s;
    }
    location ~ /\.(?!well-known) { deny all; }
}
server { listen 80; server_name memo.example.edu.ng; return 301 https://$host$request_uri; }
